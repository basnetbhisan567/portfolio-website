<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 404s must never be indexed -->
  <meta name="robots" content="noindex, follow" />
  <meta name="color-scheme" content="dark light" />
  <title>404 — Page not found | Bhisan Basnet</title>
  <meta name="description" content="This route doesn't exist. Head back to Bhisan Basnet's portfolio — full-stack projects with React, Python, Java, and C++." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2305080f'/%3E%3Ctext%20x='32'%20y='43'%20font-family='monospace'%20font-weight='bold'%20font-size='26'%20fill='%2334d399'%20text-anchor='middle'%3EBB%3C/text%3E%3C/svg%3E" />

  <!-- SELF-CONTAINED ON PURPOSE: a 404 serves at any URL depth
       (/a/b/c/404), so relative links to styles.css would break. -->
  <style>
    :root {
      --bg: #05080f;
      --card: #0a0f1a;
      --border: rgba(148, 163, 184, 0.16);
      --text-1: #eef2f9;
      --text-2: #a9b6ca;
      --accent: #34d399;
      --accent-2: #22d3ee;
      --on-accent: #04110b;
      --mono: 'JetBrains Mono', ui-monospace, 'Fira Code', monospace;
      --sans: 'Inter', system-ui, sans-serif;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --text-1: #0b1524;
        --text-2: #3f4c62;
        --accent: #047857;
        --accent-2: #0e7490;
        --on-accent: #ffffff;
        color-scheme: light;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: clip;
      transition: background-color 0.4s ease;
    }
    #fx { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; }
    .wrap { width: min(640px, 100%); text-align: center; }

    .term {
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.45);
      margin-bottom: 2rem;
    }
    .term__bar {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.06);
    }
    .term__dot { width: 11px; height: 11px; border-radius: 50%; }
    .term__dot--r { background: #ff5f57; }
    .term__dot--y { background: #ffbd2e; }
    .term__dot--g { background: #28ca42; }
    .term__title { margin-left: 0.6rem; font-family: var(--mono); font-size: 0.75rem; color: var(--text-2); }
    .term__body {
      padding: 1.25rem;
      min-height: 190px;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.95;
      color: var(--text-2);
      word-break: break-word;
    }
    .t-cmd { color: var(--accent); }
    .t-out { opacity: 0.85; padding-left: 1.1rem; }
    .t-err { color: #f87171; padding-left: 1.1rem; }
    .t-caret { display: inline-block; width: 8px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.02em;
      font-weight: 700;
      line-height: 1.1;
    }
    .lead { color: var(--text-2); margin-top: 0.6rem; font-size: 1.02rem; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.9rem; justify-content: center; margin-top: 1.8rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.8rem 1.5rem; border-radius: 12px;
      font-weight: 600; font-size: 0.95rem; text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn--primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: var(--on-accent);
    }
    .btn--primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -10px rgba(2, 8, 20, 0.55); }
    .btn--ghost { border: 1px solid var(--border); color: var(--text-1); }
    .btn--ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    .chip {
      display: inline-block;
      margin-top: 2.2rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
    }
    .chip b { color: var(--accent); font-weight: 600; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t-caret { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="wrap">
    <div class="term" aria-hidden="true">
      <div class="term__bar">
        <span class="term__dot term__dot--r"></span>
        <span class="term__dot term__dot--y"></span>
        <span class="term__dot term__dot--g"></span>
        <span class="term__title">bhisan@portfolio: ~</span>
      </div>
      <div class="term__body" id="term-body"></div>
    </div>

    <h1>Page not found</h1>
    <p class="lead">This route doesn't exist — but the portfolio does.</p>

    <div class="actions">
      <a class="btn btn--primary" href="/">Back home</a>
      <a class="btn btn--ghost" href="/#projects">View projects</a>
    </div>

    <p class="chip mono" aria-hidden="true"><b>ERR·404</b> · SIGNAL LOST · bhisanbasnet.com</p>
  </main>

  <script>
    (() => {
      'use strict';
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---- Terminal: echoes the ACTUAL requested path (safe: textContent only) ---- */
      const raw = location.pathname && location.pathname !== '/' ? location.pathname : '/this-page';
      const path = raw.length > 42 ? raw.slice(0, 39) + '…' : raw;

      const LINES = [
        { t: '$ curl -I bhisanbasnet.com' + path, cls: 't-cmd', type: true },
        { t: 'HTTP/2 404 — route not found', cls: 't-err' },
        { t: '$ ls /portfolio', cls: 't-cmd', type: true },
        { t: 'about/  projects/  skills/  education/  contact/', cls: 't-out' },
        { t: '$ suggest --next', cls: 't-cmd', type: true },
        { t: '→ head home, or jump to a section above.', cls: 't-out' }
      ];
      const body = document.getElementById('term-body');
      const line = (cls, text) => {
        const d = document.createElement('div');
        d.className = cls;
        if (text) d.textContent = text;   // textContent — never innerHTML for the path
        return d;
      };
      const finish = () => {
        const c = line('t-cmd');
        const caret = document.createElement('span');
        caret.className = 't-caret';
        c.appendChild(caret);
        body.appendChild(c);
      };

      if (reduced) {
        LINES.forEach((l) => body.appendChild(line(l.cls, l.t)));
        finish();
      } else {
        (async () => {
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          for (const l of LINES) {
            if (!l.type) { body.appendChild(line(l.cls, l.t)); await sleep(240); continue; }
            const d = line(l.cls);
            body.appendChild(d);
            for (const ch of l.t) { d.textContent += ch; await sleep(22 + Math.random() * 40); }
            await sleep(300);
          }
          finish();
        })();
      }

      /* ---- Matrix rain: same guards as the portfolio (save-data / weak / small) ---- */
      const canvas = document.getElementById('fx');
      const conn = navigator.connection;
      const ok = !reduced && innerWidth > 640 &&
                 !(conn && conn.saveData) &&
                 (navigator.hardwareConcurrency || 8) > 4;
      if (!canvas) return;
      if (!ok) { canvas.remove(); return; }

      const light = matchMedia('(prefers-color-scheme: light)').matches;
      const ctx = canvas.getContext('2d', { alpha: false });
      const FONT = 16;
      const GLYPHS = 'アイウエオカキクケコサシスセソ0123456789<>[]{}/*+=-$#';
      const base  = light ? '#f7f9fc' : '#05080f';
      const trail = light ? 'rgba(247, 249, 252, 0.16)' : 'rgba(5, 8, 15, 0.14)';
      const glyph = light ? 'rgba(4, 120, 87, 0.35)' : 'rgba(52, 211, 153, 0.4)';
      const head  = light ? '#047857' : '#a7f3d0';

      let cols = 0, drops = [], tick = 0, rafId = null;
      const resize = () => {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        cols = Math.ceil(canvas.width / FONT);
        drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -60));
        ctx.font = FONT + 'px "JetBrains Mono", monospace';
        ctx.textBaseline = 'top';
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      const step = () => {
        ctx.fillStyle = trail;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < cols; i++) {
          const y = drops[i] * FONT;
          ctx.fillStyle = Math.random() > 0.975 ? head : glyph;
          ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], i * FONT, y);
          drops[i] += 1;
          if (y > canvas.height && Math.random() > 0.976) drops[i] = Math.floor(Math.random() * -20);
        }
      };
      const loop = () => { if (tick++ % 2 === 0) step(); rafId = requestAnimationFrame(loop); };
      resize();
      rafId = requestAnimationFrame(loop);
      let rt;
      addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 180); }, { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
        else if (rafId === null) rafId = requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
</html>
